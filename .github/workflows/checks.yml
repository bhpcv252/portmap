name: Checks

"on":
  push:
    branches:
      - main
  pull_request: {}

jobs:
  checks:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Verify build
        run: go build .

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs:
      - checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage-unit.txt
      - name: Upload unit coverage
        uses: codecov/codecov-action@v5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: "./coverage-unit.txt"
          flags: unit
          name: unit-tests
          fail_ci_if_error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
      - checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Docker
        run: docker version
      - name: Run integration tests
        run:
          go test -v -tags=integration -covermode=atomic -coverprofile=coverage-integration.txt
          ./...
      - name: Upload integration coverage
        uses: codecov/codecov-action@v5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: "./coverage-integration.txt"
          flags: integration
          name: integration
          fail_ci_if_error: true

  e2e:
    name: E2E & Outbox Tests
    runs-on: ubuntu-latest
    needs:
      - checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Docker
        run: docker version
      - name: Run e2e and outbox tests
        run:
          go test -v -tags=e2e,outbox -timeout=30m -covermode=atomic -coverprofile=coverage-e2e-outbox.txt
          ./...
      - name: Upload e2e/outbox coverage
        uses: codecov/codecov-action@v5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: "./coverage-e2e-outbox.txt"
          flags: e2e,outbox
          name: e2e-outbox
          fail_ci_if_error: true
